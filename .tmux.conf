unbind C-b
set-option -g prefix C-h
bind-key C-h send-prefix
set -g status-right '#H'
# Orange status bar in the "ai" session, where agent commands run, to tell it apart from mine.
# Set per session through hooks, since tmux before 3.2 does not expand formats in styles. The
# run-shell covers an "ai" session that already exists when this file is reloaded.
set -g status-style bg=green,fg=black
set-hook -g session-created 'if -F "#{==:#{session_name},ai}" "set status-style bg=colour208,fg=black"'
set-hook -g session-renamed 'if -F "#{==:#{session_name},ai}" "set status-style bg=colour208,fg=black"'
run-shell 'tmux set -t =ai: status-style bg=colour208,fg=black 2> /dev/null || true'
set-option -g history-limit 10000
# To enable scrollback directly with the mouse, https://stackoverflow.com/a/78221076/320594
setw -g mouse on
# Start panes as non-login shells so they don't re-source /etc/profile.d, which on some
# hosts sets a read-only TMOUT auto-logout. tmux runs this through /bin/sh -c, so $SHELL
# expands here and exec replaces sh with an interactive non-login shell. TMOUT is then
# dropped and HISTTIMEFORMAT restored from jhlp_init/jhlp_bashrc.
set -g default-command 'exec "${SHELL:-bash}"'
# resize-window pins the window with `window-size manual`; unset it so the window keeps following
# the attached clients instead of showing dots around a stale size.
set-hook -g after-resize-window 'setw -u window-size'
